<style>

.ic{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:32px;height:32px;cursor:pointer}
.msgs{height:52vh;overflow-y:auto;padding:12px;display:grid;gap:8px;align-content:start}

document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset,p=mine(),n=(s,mn,mx)=>Math.min(mx,Math.max(mn,Math.round(+($(s)&&$(s).value)||0)));
 const X=new Set(["apr","sub","evt","events","xapr","xrej","xsubm","xreg","bclaim","eclaim","xbadd","xeadd","xedel","mkadm","rmadm","bgt","staff","locker","gems","subs","upg"]);if(!X.has(a))return;e.stopImmediatePropagation();snd("click");

 if(a==="apr"){const r=recs.find(x=>x.id===d.id);if(!r)return;const sd=$(`[data-sd="${CSS.escape(d.id)}"]`),pt=$(`[data-pt="${CSS.escape(d.id)}"]`),patch={st:"a"};if(sd)patch.stars=+sd.value;if(adm&&pt&&pt.value!=="")patch.pts=Math.min(5000,Math.max(0,Math.round(+pt.value)));

   const patch={pct,att,vid,st:adm?"a":"p",t:Date.now()};if(adm&&sp&&sp.value!=="")patch.pts=n("#spt",0,5000);if(adm&&ss&&+ss.value>0)patch.stars=+ss.value;
   return W(async()=>{await db.collection("records").doc(id).update(patch);if(im)await db.collection("proofs").doc(id).set({img:im});sel=null;snd("ok");toast(pct>=100?"Completion submitted":"Progress updated")})}
  const rec={uid:me,lk,gid,n:nme.slice(0,60),by:$("#sb").value.trim().slice(0,40),diff:+$("#sd").value,rate:+$("#sr").value,pct,att,vid,cu:$("#scu").checked,st:adm?"a":"p",t:Date.now()};
  if(adm&&sp&&sp.value!=="")rec.pts=n("#spt",0,5000);if(adm&&ss&&+ss.value>0)rec.stars=+ss.value;
  return W(async()=>{await db.collection("records").doc(id).set(rec);if(im)await db.collection("proofs").doc(id).set({img:im});sel=null;snd("ok");toast(adm?"Added":"Submitted for review")})}
 if(a==="xsubm"){if(!p)return;const key=d.ref+"_"+d.n,v=url(($(`[data-vl="${CSS.escape(key)}"]`)||{}).value||""),pc=+(($(`[data-pc="${CSS.escape(key)}"]`)||{}).value)||0,src=d.k==="b"?bounties.find(x=>x.id===d.ref):EVT.find(x=>x.id===d.ref);
  if(!src||!v||pc<(+src.pct||1)||pc>100){err="Add a video link and a percent of at least "+((src&&src.pct)||1)+".";snd("err");return render()}
  return W(async()=>{await db.collection("xsub").doc(me+"_"+d.ref+"_"+d.n).set({uid:me,ref:d.ref,k:d.k,n:String(d.n),vid:v,pct:pc,st:"p",t:Date.now()});snd("ok");toast("Run submitted")})}
 if(a==="xreg")return W(async()=>{await db.collection("xsub").doc(me+"_"+d.ref+"_reg").set({uid:me,ref:d.ref,k:"e",n:"reg",vid:"",pct:0,st:"p",t:Date.now()});snd("ok");toast("Registration sent")});
 if(a==="xapr"){const x=XS.find(z=>z.id===d.id);return W(async()=>{await db.collection("xsub").doc(d.id).update({st:"a"});if(x)notify(x.uid,"review",x.n==="reg"?"Your event registration was approved":"Your run "+x.n+" was approved");snd("ok")})}
 if(a==="xrej"){const x=XS.find(z=>z.id===d.id);return W(async()=>{await db.collection("xsub").doc(d.id).delete();if(x)notify(x.uid,"review","Your "+(x.n==="reg"?"registration":"run "+x.n)+" was rejected")})}
 if(a==="bclaim"){const bt=bounties.find(x=>x.id===d.id),c=p.claimed||[];if(!bt||c.some(x=>x.i===bt.id))return;let dn=0;for(let i=1;i<=bt.runs;i++)if(xst(bt.id,i)==="completed")dn++;if(dn<bt.runs)return snd("err");
  await upd({claimed:[...c,{i:bt.id,r:+bt.r||0}],cv:(p.cv||0)+(+bt.rd||0)*10});snd("buy");return toast("Bounty claimed")}
 if(a==="eclaim"){const v=EVT.find(x=>x.id===d.ref),c=p.claimed||[],id="e:"+d.ref+":"+d.n;if(!v||c.some(x=>x.i===id))return;
  if(d.n==="all"){let dn=0;for(let i=1;i<=v.runs;i++)if(xst(v.id,i)==="completed")dn++;if(dn<v.runs)return snd("err");await upd({claimed:[...c,{i:id,r:0}],cv:(p.cv||0)+(+v.rd||0)*10})}
  else{if(xst(v.id,d.n)!=="completed")return snd("err");await upd({claimed:[...c,{i:id,r:+v.rp||0}]})}snd("buy");return toast("Reward claimed")}
 if(a==="xbadd"){const nme=$("#xb_n").value.trim();if(!nme)return;const o={n:nme,lk:/^\d+$/.test(nme)?nme:slug(nme),note:$("#xb_o").value.trim(),r:n("#xb_r",0,1e5),rd:n("#xb_d",0,1e5),runs:n("#xb_u",1,5)||1,pct:$("#xb_p").value===""?100:n("#xb_p",1,100),len:$("#xb_l").value.trim(),stars:+$("#xb_s").value,img:url($("#xb_i").value.trim()),vid:url($("#xb_v").value.trim()),req:$("#xb_q").value.trim(),t:Date.now()};
  return W(async()=>{await db.collection("bounties").add(o);toast("Bounty created")})}
 if(a==="xeadd"){const t=$("#xe_t").value.trim();if(!t)return;const ts=s=>s?new Date(s).getTime():0,o={title:t,lvl:$("#xe_n").value.trim(),desc:$("#xe_o").value.trim(),runs:n("#xe_u",1,10)||1,pct:$("#xe_p").value===""?100:n("#xe_p",1,100),rp:n("#xe_r",0,1e5),rd:n("#xe_d",0,1e5),stars:+$("#xe_s").value,start:ts($("#xe_a").value),end:ts($("#xe_e").value),img:url($("#xe_i").value.trim()),vid:url($("#xe_v").value.trim()),t:Date.now()};
  return W(async()=>{await db.collection("events").add(o);toast("Event created")})}
 if(a==="xedel")return W(()=>db.collection("events").doc(d.id).delete());
 if(a==="mkadm")return W(async()=>{await db.doc("admins/"+d.id).set({lvl:"admin",t:Date.now()});await db.doc("roles/"+d.id).set({role:"admin"});toast("Admin added")});
 if(a==="rmadm")return W(async()=>{await db.doc("admins/"+d.id).delete();if(roles[d.id]==="admin")await db.doc("roles/"+d.id).delete();toast("Admin removed")});
 if(a==="bgt"){const cur=GR[d.id]||[],nx=cur.includes(d.b)?cur.filter(x=>x!==d.b):[...cur,d.b];return W(()=>db.doc("grants/"+d.id).set({b:nx}))}
},true);

const HQ=[["No-cut Hard Demon","Clear a Hard Demon or harder. Upload the full run with no cuts.",350,20,4],["Demon trio","Clear three different Demon-rated levels. Show all three clears.",500,40,4],["Fresh eyes","Clear a level released in the last 30 days. Show the release date.",450,30,4],["Medium in 50","Clear a Medium Demon in under 50 attempts. Attempt counter visible.",400,25,4],["Cold start","Beat a Demon from 0% with no practice mode. One continuous video.",380,25,4],["Epic pair","Clear two Epic rated levels. Show both clears.",420,30,4],["Five-run grind","Get five separate 70%+ progress runs on one Demon. Link the full session.",350,25,4],["Two-player clear","Clear a 2-player level with a friend. Both players on screen.",360,25,4],["Extreme clear","Clear an Extreme Demon. Full run with the end screen.",900,75,5],["Platformer pro","Clear a Hard Demon or harder platformer. Full run.",600,50,5],["Under 200","Clear an Insane Demon in under 200 attempts. Attempt counter visible.",700,60,5],["Handcam hero","Clear a Hard Demon or harder with a handcam in frame.",650,55,5],["Verify a new level","Be the first to verify a new custom level. Show the whole verification.",800,70,5],["Top 50 clear","Clear a level from the top 50 of the list. Full run.",1000,100,5]];
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(!["qhard","adjc","adjg","adjall"].includes(a))return;e.stopImmediatePropagation();if(!adm)return;snd("click");
 const inc=firebase.firestore.FieldValue.increment,tgt=players.find(x=>x.id===d.id);
 if(a==="qhard"){const have=new Set(quests.map(q=>q.t));const add=HQ.filter(q=>!have.has(q[0]));if(!add.length)return toast("Hard quests are already loaded");
  return W(async()=>{for(const q of add)await db.collection("quests").add({t:q[0],d:q[1],r:q[2],g:q[3],dif:q[4],pf:1,we:0,cs:""});toast(add.length+" hard proof quests added")})}
 if(a==="adjc"||a==="adjg"){const v=Math.round(+$(a==="adjc"?"#adjc":"#adjg").value);if(!v||!tgt)return;
  const bal=a==="adjc"?B(tgt):DIA(tgt),amt=v<0?-Math.min(-v,Math.max(0,bal)):v;if(!amt)return toast("Nothing to remove");
  return W(async()=>{await db.collection("players").doc(d.id).update(a==="adjc"?{spent:inc(-amt)}:{cv:inc(amt*10)});notify(d.id,"admin",`An admin ${amt>0?"gave you":"took"} ${fmt(Math.abs(amt))} ${a==="adjc"?"coins":"gems"}.`);toast("Done: "+(amt>0?"+":"")+amt)})}
 if(a==="adjall"){const P=+$("#ea_p").value||0,C=+$("#ea_c").value||0,G=+$("#ea_g").value||0;if(!P&&!C&&!G)return;
  const L=players.filter(x=>x.name&&!bans.has(x.id));if(!confirm(`Apply points ${P}, coins ${C}, gems ${G} to ${L.length} players?`))return;
  return W(async()=>{for(let i=0;i<L.length;i+=200){const bt=db.batch();L.slice(i,i+200).forEach(x=>{const u={};if(C)u.spent=inc(-(C<0?-Math.min(-C,Math.max(0,B(x))):C));if(G)u.cv=inc((G<0?-Math.min(-G,DIA(x)):G)*10);if(Object.keys(u).length)bt.update(db.collection("players").doc(x.id),u);if(P)bt.set(db.collection("adj").doc(x.id),{pts:(adjm[x.id]||0)+P})});await bt.commit()}toast("Applied to "+L.length+" players")})}
},true);
